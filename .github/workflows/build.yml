name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 设置 Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.25.0 gspread pandas

      - name: 执行打包 APK
        run: |
          flet build apk --verbose

      - name: 查找并打包 APK 路径
        run: |
          mkdir -p build_output
          find . -name "*.apk" -exec cp {} build_output/ \;
          ls -la build_output/

      - name: 上传 APK 到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-flet-apk
          path: build_output/*.apk
