name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 设置 Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装指定版本的 Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install flet gspread pandas

      - name: 配置环境变量跳过交互
        run: echo "FLET_SUPPRESS_PROMPTS=true" >> $GITHUB_ENV

      - name: 执行打包 APK
        run: |
          flet build apk --verbose
