
name: Build APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: stable
          cache: true

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flet==0.25.0" packaging

      - name: Check build environment
        run: |
          python --version
          pip show flet
          flutter --version
          java -version

      - name: Build APK
        run: |
          flet build apk --verbose

      - name: Collect APK
        run: |
          mkdir -p build_output
          find build -name "*.apk" -exec cp {} build_output/ \;
          ls -lh build_output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ticketcheck-apk
          path: build_output/*.apk
          if-no-files-found: error
